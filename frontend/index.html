<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>超級瑪利歐：雙寶金幣收集戰</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

    :root {
      --mario-red: #E52521; --mario-blue: #049CD8; --mario-green: #43B047; --mario-yellow: #FBD000;
      --bg-sky: #5CB8FF; --text-dark: #333;
    }

    body {
      font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
      background-color: var(--bg-sky); margin: 0; padding: 15px; color: var(--text-dark);
      background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.6) 10%, transparent 10.5%),
                        radial-gradient(circle at 80% 60%, rgba(255,255,255,0.4) 15%, transparent 15.5%);
      background-attachment: fixed;
    }

    .container { max-width: 800px; margin: 0 auto; padding-bottom: 80px; }

    /* HUD */
    .hud {
      background: rgba(0, 0, 0, 0.85); color: white; padding: 15px 20px; border-radius: 15px;
      display: flex; justify-content: space-between; align-items: center; font-size: 24px;
      font-family: 'Fredoka One', sans-serif; border: 4px solid white; box-shadow: 0 6px 0 rgba(0,0,0,0.5);
      position: sticky; top: 10px; z-index: 100; margin-bottom: 25px;
    }
    .player-profile { display: flex; align-items: center; gap: 15px; }
    .avatar-img {
      width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--mario-yellow);
      object-fit: cover; background-color: white; box-shadow: 0 0 10px rgba(251, 208, 0, 0.5); transition: transform 0.3s;
    }
    .player-select {
      background: rgba(255, 255, 255, 0.2); color: white; border: 2px solid white; border-radius: 8px;
      padding: 5px 10px; font-family: 'Fredoka One', 'Microsoft JhengHei', sans-serif; font-size: 20px; cursor: pointer; outline: none;
    }
    .player-select option { color: #333; font-family: 'Segoe UI', sans-serif; font-weight: bold;}
    .hud-info { display: flex; gap: 15px; align-items: center; }
    .coin-text { color: var(--mario-yellow); text-shadow: 2px 2px 0 #b49100; font-size: 28px; }
    .star-text { color: var(--mario-yellow); text-shadow: 2px 2px 0 #d97700; font-size: 28px; filter: drop-shadow(0 0 8px #FFD700); }

    /* 手風琴面板 */
    details { background: white; border: 4px solid #000; border-radius: 16px; margin-bottom: 20px; box-shadow: 6px 6px 0 rgba(0,0,0,0.2); overflow: hidden; }
    summary { font-size: 22px; font-weight: bold; padding: 18px 20px; cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: space-between; background: #f8f9fa; transition: background 0.2s; }
    summary::-webkit-details-marker { display: none; }
    summary:after { content: '▼'; font-size: 16px; color: #666; transition: transform 0.3s; }
    details[open] summary:after { transform: rotate(180deg); }
    details.theme-good summary { background: #e8f5e9; color: #2e7d32; border-bottom: 4px solid #c8e6c9; }
    details.theme-bad summary { background: #ffebee; color: #c62828; border-bottom: 4px solid #ffcdd2; }
    details.theme-shop summary { background: #e3f2fd; color: #1565c0; border-bottom: 4px solid #bbdefb; }
    details.theme-history summary { background: #f3e5f5; color: #6a1b9a; border-bottom: 4px solid #e1bee7; }

    .task-list { padding: 15px; margin: 0; display: flex; flex-direction: column; gap: 12px; }
    .task-item { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 12px 15px; border-radius: 12px; border: 3px solid #e9ecef; font-size: 18px; font-weight: 600; }
    
    .history-log { background: #fafafa; flex-direction: column; align-items: flex-start; gap: 5px; border-left: 6px solid #9c27b0; }
    .history-time { font-size: 14px; color: #888; font-weight: normal; }
    .history-title { color: var(--text-dark); font-size: 18px; }

    /* 自訂兌換區 */
    .custom-shop-box { background: #fff; padding: 15px; border-radius: 12px; border: 3px dashed var(--mario-blue); margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }
    .custom-shop-title { color: var(--mario-blue); font-weight: bold; font-size: 18px; margin: 0;}
    .custom-input { padding: 12px; border-radius: 8px; border: 2px solid #bbdefb; font-size: 18px; outline: none; font-family: 'Segoe UI', sans-serif; width: 100%; box-sizing: border-box; }
    .custom-row { display: flex; gap: 10px; }

    /* 按鈕 */
    .btn { min-width: 54px; min-height: 54px; border-radius: 12px; border: 4px solid #000; font-size: 20px; font-weight: bold; font-family: 'Fredoka One', sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: inset -3px -3px 0 rgba(0,0,0,0.3); transition: transform 0.1s; padding: 0 15px; }
    .btn:active { transform: translateY(4px); box-shadow: none; }
    .btn-question { background: var(--mario-yellow); color: #c07a00; font-size: 26px; padding: 0;}
    .btn-goomba { background: var(--mario-red); color: white; }
    .btn-shop { background: var(--mario-blue); color: white; }
    .btn-shop:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; opacity: 0.7; }
    .btn-completed { background: #e0e0e0 !important; color: #888 !important; border-color: #aaa !important; box-shadow: none !important; cursor: not-allowed !important; }

    .sys-controls { text-align: center; margin-top: 30px; }
    .btn-export { background: #333; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 50px; cursor: pointer; }
    .anim-float { position: absolute; font-size: 36px; pointer-events: none; animation: floatUp 0.8s ease-out forwards; z-index: 999; }
    @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-80px) scale(1.5); opacity: 0; } }

  </style>
</head>
<body>

  <div class="container">
    <div class="hud">
      <div class="player-profile">
        <img id="avatar-img" src="images/mario.jpeg" alt="Player Avatar" class="avatar-img">
        <select class="player-select" id="player-selector" onchange="switchPlayer()">
          <option value="kyle">👦 哥哥 Kyle</option>
          <option value="ryder">👦 弟弟 Ryder</option>
        </select>
      </div>
      <div class="hud-info">
        <div><span class="coin-text">🟡</span> x <span id="ui-coins">0</span></div>
        <div><span class="star-text">🌟</span> x <span id="ui-stars">0</span></div>
      </div>
    </div>

    <div id="app-content"></div>

    <details class="theme-history">
      <summary>📜 歷史兌換存摺</summary>
      <div class="task-list" id="history-container"></div>
    </details>

    <div class="sys-controls">
      <button class="btn-export" onclick="exportLogsToCSV()">📥 下載專屬紀錄報表 (CSV)</button>
    </div>
  </div>

  <script>
    function resolveApiBase() {
      // 手動覆寫（localStorage）優先
      try {
        const override = localStorage.getItem('api_base_override');
        if (override && override.trim()) return override.trim().replace(/\/+$/, '');
      } catch (_) {}
      const host = (location && location.hostname) || '';
      // 本機開發：打 127.0.0.1:8001
      if (host === 'localhost' || host === '127.0.0.1') return 'http://127.0.0.1:8001/api';
      // GitHub Pages（靜態站，無同源後端）：打 Fly 後端
      if (host.endsWith('github.io')) return 'https://good-hobbies-api.fly.dev/api';
      // 其餘（如 EC2 nginx 反向代理）走同源 /api
      if (location && location.origin && location.origin !== 'null') return `${location.origin}/api`;
      return 'https://good-hobbies-api.fly.dev/api';
    }

    const API_BASE = resolveApiBase();
    const API_TOKEN = "qsqMoZRQnCaEZVcCpahSbE2I-S1uflOLusaexs3k1u0";
    const playerConfig = { 'kyle': { avatar: 'images/mario.jpeg' }, 'ryder': { avatar: 'images/yoshi.jpeg' } };
    let allTasksData = {}; 
    let currentPlayer = 'kyle'; 
    let currentTasks = []; 
    let totalCoins = 0; 
    let behaviorLogs = []; 
    let completedTasks = []; 
    const COINS_PER_STAR = 10;

    async function fetchJsonOrText(res) {
      const contentType = (res.headers.get('content-type') || '').toLowerCase();
      try {
        if (contentType.includes('application/json')) return await res.json();
      } catch (e) {}
      return await res.text();
    }

    async function apiFetch(url, options = {}) {
      const method = (options.method || 'GET').toUpperCase();
      const headers = { ...(options.headers || {}) };

      // V2.2：所有 API 呼叫都需帶 Authorization Bearer token（含 GET /api/status）
      headers['Authorization'] = `Bearer ${API_TOKEN}`;

      const res = await fetch(url, { ...options, method, headers });
      const payload = await fetchJsonOrText(res);
      if (!res.ok) {
        const msg =
          (payload && typeof payload === 'object' && (payload.detail || payload.message)) ||
          (typeof payload === 'string' && payload.trim()) ||
          `HTTP ${res.status}`;
        throw new Error(msg);
      }
      return payload;
    }

    async function refreshStatus() {
      const [data, logs] = await Promise.all([
        apiFetch(`${API_BASE}/status`),
        apiFetch(`${API_BASE}/transactions/${currentPlayer}?limit=100`).catch(() => []),
      ]);
      const users = Array.isArray(data.users) ? data.users : [];
      const me = users.find(u => u && u.name === currentPlayer);
      totalCoins = me && Number.isFinite(Number(me.current_coins)) ? Number(me.current_coins) : 0;
      behaviorLogs = Array.isArray(logs) ? logs : [];
      // 從後端 Ledger 取得「今天已記過分的任務」，畫面一載入就鎖定不可再勾選
      completedTasks = Array.isArray(me && me.completed_task_ids_today)
        ? [...me.completed_task_ids_today]
        : [];
      updateUI();
      return data;
    }

    async function loadConfigAndInit() {
      try {
        allTasksData = await apiFetch(`${API_BASE}/tasks`);
        console.log("任務清單讀取成功（API）", allTasksData);
      } catch (error) {
        console.warn("⚠️ API 任務清單失敗，改讀取本機 tasks.json", error?.message || error);
        try {
          const response = await fetch('tasks.json');
          if (response.ok) {
            allTasksData = await response.json();
          }
        } catch (e) {
          console.warn("⚠️ tasks.json 也讀取失敗", e?.message || e);
        }
      }
      
      const savedPlayer = localStorage.getItem('mario_last_player');
      if (savedPlayer && playerConfig[savedPlayer]) currentPlayer = savedPlayer;
      document.getElementById('player-selector').value = currentPlayer;
      
      // 確保在載入玩家資料前，已經取得任務清單
      await loadPlayerData(); 
    }

    async function switchPlayer() {
      currentPlayer = document.getElementById('player-selector').value;
      localStorage.setItem('mario_last_player', currentPlayer);
      await loadPlayerData();
    }

    async function loadPlayerData() {
      const img = document.getElementById('avatar-img');
      img.src = playerConfig[currentPlayer].avatar;
      img.style.transform = 'scale(1.2)';
      setTimeout(() => img.style.transform = 'scale(1)', 200);

      currentTasks = [...(allTasksData[currentPlayer] || []), ...(allTasksData['common'] || [])];

      renderApp(); 
      try {
        await refreshStatus();
      } catch (error) {
        alert(`API 連線失敗：${error.message || error}`);
        totalCoins = 0;
        behaviorLogs = [];
        completedTasks = [];
        updateUI();
      }
    }

    function renderApp() {
      const container = document.getElementById('app-content');
      container.innerHTML = '';
      
      currentTasks.forEach(category => {
        if (!category.isActive) return;
        const details = document.createElement('details');
        details.className = category.theme;
        if (category.defaultOpen) details.open = true;

        const summary = document.createElement('summary');
        summary.innerText = category.title;
        details.appendChild(summary);

        const list = document.createElement('div');
        list.className = 'task-list';

        category.tasks.forEach(task => {
          const item = document.createElement('div');
          item.className = 'task-item';
          let btnHTML = '';

          if (task.type === 'shop') {
            btnHTML = `<button class="${task.btnClass}" data-cost="${task.costStars}" onclick="handleShopClick('${task.name}', ${task.costStars})">${task.btnText}</button>`;
          } else if (task.type === 'earn') {
            if (completedTasks.includes(task.id)) {
              btnHTML = `<button class="btn btn-completed" disabled>✅</button>`;
            } else {
              btnHTML = `<button class="btn ${task.btnClass}" ${task.style ? `style="${task.style}"` : ''} onclick="handleTaskClick(this, '${task.id}', '${task.name}', ${task.points}, '${task.type}')">${task.btnText}</button>`;
            }
          } else {
            btnHTML = `<button class="btn ${task.btnClass}" ${task.style ? `style="${task.style}"` : ''} onclick="handleTaskClick(this, '${task.id}', '${task.name}', ${task.points}, '${task.type}')">${task.btnText}</button>`;
          }
          item.innerHTML = `<span>${task.name}</span>${btnHTML}`;
          list.appendChild(item);
        });

        if (category.theme === 'theme-shop') {
          const customBox = document.createElement('div');
          customBox.className = 'custom-shop-box';
          customBox.innerHTML = `
            <p class="custom-shop-title">✍️ 自訂願望兌換</p>
            <input type="text" id="custom-name" class="custom-input" placeholder="例如：買一個扭蛋、吃冰淇淋">
            <div class="custom-row">
              <input type="number" id="custom-cost" class="custom-input" placeholder="🌟星數" min="1" style="width: 100px;">
              <button class="btn btn-shop" onclick="handleCustomShopClick()" style="flex-grow: 1;">確認兌換</button>
            </div>
          `;
          list.appendChild(customBox);
        }
        details.appendChild(list);
        container.appendChild(details);
      });
    }

    function handleShopClick(name, costStars) { processExchange(name, costStars); }

    function handleCustomShopClick() {
      const nameInput = document.getElementById('custom-name');
      const costInput = document.getElementById('custom-cost');
      const name = nameInput.value.trim();
      const costStars = parseInt(costInput.value);
      if (!name) { alert("請輸入想要兌換的願望喔！"); return; }
      if (!costStars || costStars <= 0) { alert("請輸入需要花費的星星數量！"); return; }
      processExchange(`✨ ${name} (自訂願望)`, costStars).then(success => {
          if (success) { nameInput.value = ''; costInput.value = ''; }
      });
    }

    async function processExchange(name, costStars) {
      const costCoins = costStars * COINS_PER_STAR;
      if (totalCoins >= costCoins) {
        if (confirm(`確定要花費 ${costStars} 顆🌟兌換【${name}】嗎？`)) {
          try {
            await sendActionToBackend('shop_custom', name, -costCoins, 'shop_spend');
            alert("🎉 兌換成功！已記錄到存摺。");
            return true;
          } catch (e) {
            alert(`兌換失敗：${e.message || e}`);
            return false;
          }
        }
      } else { alert(`星星不夠喔！需要 ${costStars} 顆🌟`); }
      return false;
    }

    async function handleTaskClick(btnElement, id, name, points, type) {
      if (type === 'lose' && totalCoins < Math.abs(points)) { alert("已經沒有金幣可以扣了！"); return; }
      
      // 樂觀更新 (先改畫面讓使用者感覺順暢)
      if (type === 'earn') {
        if (completedTasks.includes(id)) return;
        completedTasks.push(id);
      }
      totalCoins += points; 
      playFloatAnim(btnElement, points > 0 ? `+${points}🟡` : `${points}🟡`); 
      updateUI();
      if (type === 'earn') renderApp();

      // 同步發送至後端
      try {
        await sendActionToBackend(id, name, points, type);
      } catch (e) {
        alert(`操作失敗：${e.message || e}`);
        await refreshStatus(); // 以後端為準把畫面校正回來
        renderApp();
      }
    }

    async function sendActionToBackend(taskId, taskName, points, actionType) {
      const reason = `${actionType}:${taskId}:${taskName}`;
      await apiFetch(`${API_BASE}/transactions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_name: currentPlayer,
          delta: points,
          reason: reason
        })
      });

      // POST 成功後：強制重新抓 status 讓上排數字即時更新
      await refreshStatus();
    }

    function updateUI() {
      if (totalCoins < 0) totalCoins = 0;
      const stars = Math.floor(totalCoins / COINS_PER_STAR); const coins = totalCoins % COINS_PER_STAR;
      document.getElementById('ui-coins').innerText = coins; document.getElementById('ui-stars').innerText = stars;
      document.querySelectorAll('.btn-shop').forEach(btn => btn.disabled = stars < parseInt(btn.dataset.cost));
      renderHistory(); 
    }

    function renderHistory() {
      const container = document.getElementById('history-container'); container.innerHTML = '';
      const shopLogs = behaviorLogs.filter(log => log.action_type === 'shop_spend');
      if (shopLogs.length === 0) { container.innerHTML = `<div style="text-align:center; padding: 20px; color:#888;">目前還沒有兌換紀錄喔！</div>`; return; }

      shopLogs.forEach(log => {
        const item = document.createElement('div'); item.className = 'task-item history-log';
        const starsSpent = Math.abs(log.point_change) / COINS_PER_STAR;
        item.innerHTML = `
          <div class="history-time">${log.timestamp}</div>
          <div style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
            <span class="history-title">${log.task_name}</span>
            <span style="color: #9c27b0; font-weight: bold; font-family: 'Fredoka One', sans-serif;">-🌟x${starsSpent}</span>
          </div>`;
        container.appendChild(item);
      });
    }

    function playFloatAnim(targetBtn, text) {
      const rect = targetBtn.getBoundingClientRect(); const anim = document.createElement('div');
      anim.className = 'anim-float'; anim.innerText = text;
      anim.style.left = (rect.left + 10) + 'px'; anim.style.top = (rect.top - 20 + window.scrollY) + 'px';
      document.body.appendChild(anim); setTimeout(() => anim.remove(), 800);
    }

    function exportLogsToCSV() {
      if (behaviorLogs.length === 0) { alert("目前還沒有紀錄喔！"); return; }
      let csvContent = "data:text/csv;charset=utf-8,\uFEFF時間,任務名稱,類型,金幣變動\n";
      behaviorLogs.forEach(r => csvContent += `${r.timestamp},${r.task_name},${r.action_type},${r.point_change}\n`);
      const link = document.createElement("a"); link.setAttribute("href", encodeURI(csvContent));
      link.setAttribute("download", `${currentPlayer}_瑪利歐行為紀錄_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }

    // 頭像連點五下 → 直接進入任務管理頁（該頁有獨立密碼視窗）
    let avatarClickCount = 0; let avatarClickTimer;
    document.getElementById('avatar-img').addEventListener('click', () => {
      avatarClickCount++;
      clearTimeout(avatarClickTimer);
      avatarClickTimer = setTimeout(() => { avatarClickCount = 0; }, 2000);
      if (avatarClickCount >= 5) {
        avatarClickCount = 0;
        window.location.href = 'admin-tasks.html';
      }
    });

    loadConfigAndInit();
  </script>
</body>
</html>
